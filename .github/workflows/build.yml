name: Build Glassify

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # 只改文档不必重新出包
    paths-ignore:
      - '**.md'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    # macOS + Xcode 工具链：arm64e 的 ABI 才是对的。
    # 之前用 Linux 的 L1ghtmann 工具链，编出的 arm64e 在 A16 上
    # objc readClass 直接 SIGBUS（安全模式 / 设置闪退）。
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install dpkg xz ldid

      - name: Checkout Theos (roothide fork)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          BASE="$(sed -n 's/^Version: //p' control | head -1 | cut -d- -f1)"
          VERSION="${BASE}-${GITHUB_RUN_NUMBER}"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package version: $VERSION"

      - name: Build package
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1
          ls -l packages/

      - name: Fix package for RootHide
        run: |
          set -euo pipefail
          for deb in packages/*.deb; do
            [ -e "$deb" ] || continue
            stage="$(mktemp -d)"
            dpkg-deb -R "$deb" "$stage"

            # theos 的 roothide scheme 会把 Architecture 写成 iphoneos-arm64e，
            # 设备 dpkg 认的是 iphoneos-arm64
            sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64/' "$stage/DEBIAN/control"

            # RootHide Bootstrap 是 rootless 布局（/var/jb），rootfs 只读装不进
            python3 tools/relocate_to_jbroot.py "$stage"
            python3 tools/check_deb_paths.py "$stage"

            # 统一 xz 压缩
            dpkg-deb -b -Zxz "$stage" "$deb"
            rm -rf "$stage"

            echo "--- $deb ---"
            dpkg-deb -f "$deb" Package Architecture Version Depends
            dpkg-deb -c "$deb" | sed -n '1,25p'

            case "$deb" in
              *_iphoneos-arm64e.deb)
                fixed="${deb%_iphoneos-arm64e.deb}_iphoneos-arm64.deb"
                mv -f "$deb" "$fixed"
                echo "renamed: $fixed"
                ;;
            esac
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glassify-deb
          path: ./packages/*.deb
          if-no-files-found: error

      - name: Create release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "Glassify v${{ steps.bump.outputs.package_version }}"
          files: ./packages/*.deb
